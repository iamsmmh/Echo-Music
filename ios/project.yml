name: EchoMusic
options:
  bundleIdPrefix: com.echomusic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  EchoMusic:
    type: application
    platform: iOS
    sources:
      - EchoMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app
        PRODUCT_NAME: Echo Music
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: EchoMusic/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: false
