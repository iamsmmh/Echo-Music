name: EchoMusic

options:
  bundleIdPrefix: com.echomusic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  EchoMusic:
    type: application
    platform: iOS
    # TEMPORARY diagnostics probe, removed once the iOS build is green again.
    preBuildScripts:
      - name: Diagnostics
        basedOnDependencyAnalysis: false
        showEnvVars: false
        scriptContent: |
          set -u

          # TEMPORARY CI diagnostics probe (referenced from ios/project.yml -> preBuildScripts).
          # Re-runs the real build in isolation, collects the compiler diagnostics Xcode
          # produces, and hands them back through Actions cache keys (readable via the public
          # API, unlike the job log from this sandbox). Delete along with that block.

          [ -n "${ECHO_DIAG_NESTED:-}" ] && exit 0

          W="$(mktemp -d "${TMPDIR:-/tmp}/diag.XXXXXX")"
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          REPORT="$W/report.txt"
          find "$SRCROOT/EchoMusic" -name '*.swift' | sort >"$W/all.txt"

          {
            echo "files=$(wc -l <"$W/all.txt" | tr -d ' ')"
            echo "xcode=$(xcodebuild -version 2>&1 | tr '\n' ' ')"
            echo "arch=$(uname -m)"
          } >"$REPORT"

          ECHO_DIAG_NESTED=1 xcodebuild \
            -project "$SRCROOT/EchoMusic.xcodeproj" \
            -scheme EchoMusic \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$W/dd" \
            -disableIndexing \
            CODE_SIGNING_ALLOWED=NO \
            build >"$W/build.log" 2>&1
          status=$?
          {
            echo "=== xcodebuild exit=$status loglines=$(wc -l <"$W/build.log" | tr -d ' ')"
            grep -E 'error:' "$W/build.log" | sed -E 's|/Users/runner/[a-zA-Z0-9._/-]*Echo-Music/||' | sort -u | head -40
            echo "=== failure summary"
            sed -n '/\*\* BUILD FAILED \*\*/,$p' "$W/build.log" | head -15
          } >>"$REPORT"

          run_emit() {
            tag="$1"
            xargs xcrun swiftc \
              -emit-module \
              -emit-module-path "$W/$tag.swiftmodule" \
              -sdk "$SDK" \
              -target "$tag" \
              -module-name Echo_Music \
              -parse-as-library \
              -swift-version 5 \
              <"$W/all.txt" >"$W/$tag.log" 2>&1
            {
              echo "=== emit $tag exit=$?"
              grep -E 'error:' "$W/$tag.log" | sed -E 's|/Users/runner/[a-zA-Z0-9._/-]*Echo-Music/||' | sort -u | head -20
            } >>"$REPORT"
          }
          run_emit "arm64-apple-ios17.0-simulator"
          run_emit "x86_64-apple-ios17.0-simulator"

          xargs xcrun swiftc \
            -typecheck \
            -sdk "$SDK" \
            -target arm64-apple-ios17.0-simulator \
            -module-name Echo_Music \
            -parse-as-library \
            -swift-version 5 \
            -Xfrontend -debug-time-expression-type-checking \
            <"$W/all.txt" >"$W/timed.log" 2>&1
          {
            echo "=== slowest expressions (ms, worst first)"
            awk '{ for (i = 1; i <= NF; i++) if ($i == "ms") { t = $(i - 1) + 0; if (t > 0) print t "\t" $0; break } }' \
              "$W/timed.log" | sort -rn | head -8 | cut -f2- | sed -E 's|/Users/runner/[a-zA-Z0-9._/-]*Echo-Music/||'
          } >>"$REPORT"

          # --- report: gzip -> base64 -> chunks carried in cache keys -----------------------
          gzip -c9 "$REPORT" | base64 | tr -d '\n=' >"$W/payload.txt"
          split -b 460 "$W/payload.txt" "$W/payload.txt.part"
          nonce="diag$(printf '%s' "${GITHUB_RUN_NUMBER:-0}a${GITHUB_RUN_ATTEMPT:-1}" | tr -cd '0-9')"
          base="${ACTIONS_RUNTIME_URL%/}"
          i=0
          if [ -n "$base" ] && [ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
            for f in "$W"/payload.txt.part*; do
              [ -e "$f" ] || continue
              chunk="$(cat "$f")"
              size=$(wc -c <"$f" | tr -d ' ')
              ver=$(shasum -a 256 "$f" | cut -c1-64)
              res="$(curl -s -m 20 -X POST "$base/_apis/artifactcache/caches" \
                -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json;api-version=6.0-preview.2" \
                -d "{\"key\":\"$nonce-$i-$chunk\",\"version\":\"$ver\",\"cacheGroup\":\"echo-diag\",\"itemPath\":\"$W\",\"reserveBytes\":$size}")"
              cid="$(printf '%s' "$res" | jq -r '.cacheId // empty' 2>/dev/null)"
              lid="$(printf '%s' "$res" | jq -r '.leaseId // empty' 2>/dev/null)"
              if [ -n "$cid" ]; then
                curl -s -m 20 -o /dev/null -X PUT "${base}_apis/artifactcache/caches/$cid" \
                  -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
                  -H "Content-Type: application/octet-stream" \
                  -H "Content-Range: bytes 0-$((size - 1))/$size" \
                  --data-binary "@$f"
                curl -s -m 20 -o /dev/null -X POST "${base}_apis/artifactcache/caches/$cid" \
                  -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
                  -H "Content-Type: application/json" \
                  -H "Accept: application/json;api-version=6.0-preview.2" \
                  -d "{\"size\":$size,\"leaseId\":\"$lid\"}"
              fi
              i=$((i + 1))
            done
          fi

          exit 0

    sources:
      - EchoMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app
        PRODUCT_NAME: Echo Music
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: EchoMusic/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      gatherCoverageData: false
