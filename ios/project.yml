name: EchoMusic

options:
  bundleIdPrefix: com.echomusic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  EchoMusic:
    type: application
    platform: iOS
    # TEMPORARY diagnostics probe, removed once the iOS build is green again.
    preBuildScripts:
      - name: Diagnostics
        basedOnDependencyAnalysis: false
        showEnvVars: false
        scriptContent: |
          set -u
          # TEMPORARY CI diagnostics probe (ios/project.yml -> preBuildScripts). Re-runs the
          # build in isolation and reports the number of `error:` lines Xcode emits through the
          # only channels this sandbox can observe: the step duration (30s per error) and the
          # fact that this phase fails the build. Delete along with that block.
          [ -n "${ECHO_DIAG_NESTED:-}" ] && exit 0
          W="$(mktemp -d "${TMPDIR:-/tmp}/diag.XXXXXX")"
          ECHO_DIAG_NESTED=1 xcodebuild \
            -project "$SRCROOT/EchoMusic.xcodeproj" \
            -scheme EchoMusic \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$W/dd" \
            -disableIndexing \
            CODE_SIGNING_ALLOWED=NO \
            build >"$W/build.log" 2>&1
          status=$?
          count="$(grep -cE 'error:' "$W/build.log" 2>/dev/null || true)"
          [ -z "$count" ] && count=0
          [ "$count" -gt 8 ] && count=8
          # Fail the outer build immediately: keeps the step duration a clean function of
          # `count` alone, and leaves the log small.
          sleep $((30 * count))
          echo "DIAG exit=$status errors=$count"
          exit 1

    sources:
      - EchoMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app
        PRODUCT_NAME: Echo Music
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: EchoMusic/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      gatherCoverageData: false
